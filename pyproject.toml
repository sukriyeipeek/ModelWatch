[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "modelwatch-lab"
version = "0.1.0"
description = "Evidence-first monitoring for classification models, with a verified Banking77 replay"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3", "httpx>=0.27,<1", "numpy>=2,<3", "scipy>=1.14,<2", "scikit-learn>=1.6,<2", "threadpoolctl>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
modelwatch = "modelwatch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modelwatch = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

